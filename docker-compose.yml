services:
  xml2pdf:
    image: ghcr.io/tonicanada/sii_chile_xml_to_pdf:latest
    container_name: xml2pdf-service
    working_dir: /app/src
    command: >
      gunicorn service.main:app
      -k uvicorn.workers.UvicornWorker
      -w ${GUNICORN_WORKERS:-2}
      -b 0.0.0.0:${PORT:-8080}
      --timeout ${GUNICORN_TIMEOUT:-120}
      --keep-alive 75
      --graceful-timeout 30
      --max-requests 200 --max-requests-jitter 50
    ports:
      - "${HOST_PORT:-9000}:${PORT:-8080}"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src
      - REDIS_HOST=redis
      - SSL_CERT_FILE=/usr/local/lib/python3.11/site-packages/certifi/cacert.pem
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Con python3 y no con curl: la imagen base es python:3.11-slim, que NO
      # trae curl, así que el chequeo nunca pudo ejecutarse — fallaba con
      # "exec: curl: executable file not found in $PATH" (exit -1, ni siquiera
      # un código HTTP) y dejaba el contenedor marcado `unhealthy` de forma
      # permanente aunque el servicio respondiera bien. No se notó porque
      # `restart: unless-stopped` reacciona a que el proceso muera, no a la
      # salud, y nadie declara `depends_on` sobre este servicio.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:${PORT:-8080}/healthz', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    image: ghcr.io/tonicanada/sii_chile_xml_to_pdf:latest
    container_name: xml2pdf-worker
    working_dir: /app/src
    command: rq worker -u redis://redis:6379 xml2pdf
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src
      - REDIS_HOST=redis
      - SSL_CERT_FILE=/usr/local/lib/python3.11/site-packages/certifi/cacert.pem
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: xml2pdf-redis
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  redis-data:
